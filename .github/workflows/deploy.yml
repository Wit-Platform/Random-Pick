name: Deploy to Vercel

# Vercel의 Git 자동 배포는 Hobby 플랜에서 private organization 레포를 거부합니다
# ("Cannot deploy from a private GitHub organization repository on the Hobby plan").
# CLI 배포는 파일을 직접 업로드하므로 그 제약을 받지 않습니다. 그래서 배포를
# Actions로 옮깁니다 — 레포는 org에 비공개로 두면서 푸시마다 자동 배포됩니다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 먼저 끝나 예전 코드가 프로덕션에 남을 수 있습니다
concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

# 프로젝트를 이름으로 찾으므로 ORG_ID / PROJECT_ID를 시크릿으로 둘 필요가 없습니다.
# 시크릿은 VERCEL_TOKEN 하나로 끝입니다.
env:
  VERCEL_PROJECT: random-pick
  VERCEL_SCOPE: sirlyuns-projects

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 확인
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::레포 Settings > Secrets and variables > Actions 에 VERCEL_TOKEN을 추가하세요."
            echo "발급: https://vercel.com/account/tokens"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 깨진 코드가 프로덕션에 올라가지 않도록 배포 전에 막습니다
      - name: 타입체크
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 테스트
        run: npm test

      # 프로젝트를 이름으로 찾아 .vercel/project.json을 만듭니다.
      # 여기서 실패하면 대개 토큰이 만료됐거나 스코프가 다른 경우입니다.
      - name: Vercel 프로젝트 링크
        run: |
          if ! npx vercel@latest link --yes \
              --project "$VERCEL_PROJECT" \
              --scope "$VERCEL_SCOPE" \
              --token=${{ secrets.VERCEL_TOKEN }}; then
            echo "::error::Vercel 링크 실패. VERCEL_TOKEN이 만료됐거나 스코프($VERCEL_SCOPE)에 접근 권한이 없습니다. 새 토큰을 발급해 시크릿을 갱신하세요: https://vercel.com/account/tokens"
            exit 1
          fi

      # 환경변수를 Vercel에서 가져옵니다. NEXT_PUBLIC_* 은 빌드 시점에 번들로
      # 구워지므로 이 단계 없이 빌드하면 카카오 JS 키가 비어버립니다.
      - name: Vercel 환경 가져오기
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 빌드
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 배포
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
