name: Deploy to Vercel

# Vercel의 Git 자동 배포는 Hobby 플랜에서 private organization 레포를 거부합니다
# ("Cannot deploy from a private GitHub organization repository on the Hobby plan").
# CLI 배포는 파일을 직접 업로드하므로 그 제약을 받지 않습니다. 그래서 배포를
# Actions로 옮깁니다 — 레포는 org에 비공개로 두면서 푸시마다 자동 배포됩니다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 먼저 끝나 예전 코드가 프로덕션에 남을 수 있습니다
concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 필요한 시크릿이 있는지 확인
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::레포 Settings > Secrets and variables > Actions 에 다음을 추가하세요:$missing"
            echo "받는 곳은 README의 'GitHub Actions 배포' 절을 참고하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 깨진 코드가 프로덕션에 올라가지 않도록 배포 전에 막습니다
      - name: 타입체크
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 테스트
        run: npm test

      # 환경변수를 Vercel에서 가져옵니다. NEXT_PUBLIC_* 은 빌드 시점에 번들로
      # 구워지므로 이 단계 없이 빌드하면 카카오 JS 키가 비어버립니다.
      - name: Vercel 환경 가져오기
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 빌드
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 배포
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
